[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "group-ood-gmmd"
version = "11.0.0"
description = "GMMD-Central and GMMD-Mean for group-level OOD detection"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Taeyeon Kim"},
  {name = "Heung-Seok Chae"},
]
dependencies = [
  "numpy>=1.26,<2",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "torch>=2.3,<3",
  "torchvision>=0.18,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
